<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101416">
<meta name="description" content="Machete — your private Amazon purchase history, unit prices, and watchlist.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Machete">
<link rel="manifest" href="./manifest.webmanifest?v=3.1">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=3.1">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=3.1">
<link rel="stylesheet" href="./styles.css?v=3.1">
<title>Machete — Purchase history</title>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <button type="button" class="brand" data-view="home" aria-label="Machete home">
      <img class="brand-mark" src="./icon.svg?v=3" alt="" width="42" height="42"><span class="brand-name">machete<span>.</span></span>
    </button>
    <button class="icon-button" type="button" data-view="settings" aria-label="Settings">
      <svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l2-1.5-2-3.5-2.4.8-2.6-1.5-.5-2.5h-4L9 4.8 6.4 6.3 4 5.5 2 9l2 1.5v3L2 15l2 3.5 2.4-.8L9 19.2l.5 2.5h4l.5-2.5 2.6-1.5 2.4.8L21 15Z"/></svg>
    </button>
  </header>
  <main id="screen" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Main navigation">
    <button class="tab active" data-view="home" aria-current="page"><svg class="icon" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z"/><path d="M9 21v-8h6v8"/></svg><span>Home</span></button>
    <button class="tab" data-view="history"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/></svg><span>History</span></button>
    <button class="tab" data-view="products"><svg class="icon" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span>Products</span></button>
    <button class="tab" data-view="deals"><svg class="icon" viewBox="0 0 24 24"><path d="m3 12 9-9h8l1 1v8l-9 9-9-9Z"/><circle cx="17" cy="7" r="1"/></svg><span>Deals</span></button>
    <button class="tab" data-view="settings"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5v-3l2-1.5-2-3.5-2.4.8-2.6-1.5-.5-2.5h-4L9 4.8 6.4 6.3 4 5.5 2 9l2 1.5v3L2 15l2 3.5 2.4-.8L9 19.2l.5 2.5h4l.5-2.5 2.6-1.5 2.4.8L21 15Z"/></svg><span>Settings</span></button>
  </nav>
</div>
<div id="overlay"></div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" accept=".zip,.csv,.json,application/zip,text/csv,application/json" hidden>
<input type="file" id="image-file" accept="image/*" hidden>
<script src="./vendor/jszip.min.js?v=3"></script>
<script src="./product-photos.js?v=3.1" defer></script>
<script src="./app.js?v=3.1" defer></script>
<script type="module" src="./auth.js?v=3"></script>
</body>
</html>
